name: Bug report
description: Report incorrect truncation or a compatibility problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Safari 16.6 on iOS 16.7
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Writing direction
      options: [LTR, RTL, Mixed, Not applicable]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the container styles, line count, text, font, and custom ellipsis if present.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
